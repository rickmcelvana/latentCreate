[package]
name = "comfy-bridge"
description = "HTTP client for the user's own ComfyUI (docs/COMFY-HTTP-SURFACE.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The fake transport, for this crate's tests and for downstream crates that
# enable it as a **dev**-dependency. Never in a release build.
test-support = []

[dependencies]
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt", "fs", "io-util"] }
