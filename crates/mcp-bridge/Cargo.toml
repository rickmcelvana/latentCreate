[package]
name = "mcp-bridge"
description = "MCP client for a local ComfyUI via `comfy-mcp`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["process", "rt", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "io-util"] }
