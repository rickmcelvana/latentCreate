[package]
name = "app"
description = "latentCreate desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.53", features = ["time", "sync"] }

create-core = { path = "../crates/create-core" }
futures-util = { version = "0.3", default-features = false }
library = { path = "../crates/library" }
mcp-bridge = { path = "../crates/mcp-bridge" }
llm-bridge = { path = "../crates/llm-bridge" }

[dev-dependencies]
# T-302's live measurement reads raw SSE to record which reasoning field name
# an endpoint uses. Dev-only: nothing in the app talks HTTP directly, and the
# crate is already in the tree via llm-bridge.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt"] }
