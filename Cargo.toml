[workspace]
resolver = "2"
members = [
    "crates/create-core",
    "crates/mcp-bridge",
    "crates/llm-bridge",
    "crates/library",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "local-only, no remote yet"

[profile.release]
lto = true
codegen-units = 1
