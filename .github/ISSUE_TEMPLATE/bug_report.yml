name: Bug report
description: Something in latentCreate did not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing latentCreate. The details below are what it takes to reproduce a
        problem on another machine -- most bugs so far depended on how ComfyUI was installed.
  - type: input
    id: version
    attributes:
      label: latentCreate version
      description: Shown at the bottom of the left-hand navigation rail.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Installer from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 / macOS 15 (Apple Silicon) / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: comfyui
    attributes:
      label: ComfyUI version and kind
      description: Setup shows the version once ComfyUI is found.
      placeholder: 0.45.2, ComfyUI Desktop / portable / manual install
    validations:
      required: true
  - type: dropdown
    id: comfy-location
    attributes:
      label: Where ComfyUI runs
      options:
        - On the same computer
        - On another computer on my network
        - Somewhere else (cloud GPU, remote server)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and VRAM
      placeholder: RTX 4080, 16 GB
  - type: input
    id: model
    attributes:
      label: Model in use
      description: The music or image model selected when it happened, if any.
      placeholder: ACE-Step 1.5 XL Turbo
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Setup
        2. Click Install on ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: session.log excerpt
      description: |
        The app's log, from around the time it happened:
        Windows `%APPDATA%\com.latentbeats.create\session.log`,
        macOS `~/Library/Application Support/com.latentbeats.create/session.log`,
        Linux `~/.config/com.latentbeats.create/session.log`.
        API keys are redacted when the log is written, but read it before pasting -- it can
        contain your prompts, lyrics and file paths.
      render: text
